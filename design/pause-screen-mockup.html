<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pause - Breathing &amp; Mindfulness</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;700&amp;family=Playfair+Display:wght@700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "primary": "#d4a954",
                    "background-light": "#f8f7f6",
                    "background-dark": "#0A0E1A",
                },
                fontFamily: {
                    "display": ["Manrope", "sans-serif"],
                    "serif": ["Playfair Display", "serif"]
                },
                borderRadius: {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
                },
            },
        },
    }
</script>
<style>
    .glow-orb {
        background: radial-gradient(circle, #d4a954 0%, rgba(212, 169, 84, 0.4) 40%, rgba(212, 169, 84, 0) 70%);
        filter: blur(8px);
    }
    .bg-gradient-navy {
        background: radial-gradient(circle at center, #1a2236 0%, #0A0E1A 100%);
    }
    body {
        min-height: max(884px, 100dvh);
    }
</style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-white overflow-hidden">

<!-- Main Container -->
<div class="relative flex h-screen w-full flex-col bg-gradient-navy dark:bg-background-dark overflow-hidden">

    <!-- Top App Bar (Minimalist) -->
    <div class="flex items-center justify-between px-6 pt-12 pb-4">
        <div class="flex size-10 shrink-0 items-center justify-center rounded-full bg-white/5 backdrop-blur-md">
            <span class="material-symbols-outlined text-white/70 text-[22px]">menu</span>
        </div>
        <h2 class="text-white/40 text-sm font-medium tracking-[0.2em] uppercase">Pause</h2>
        <div class="flex size-10 shrink-0 items-center justify-center rounded-full bg-white/5 backdrop-blur-md">
            <span class="material-symbols-outlined text-white/70 text-[22px]">settings</span>
        </div>
    </div>

    <!-- Central Orb Section -->
    <div class="flex flex-1 flex-col items-center justify-center relative">
        <!-- The Glowing Orb -->
        <div class="relative flex items-center justify-center">
            <!-- Large Glow Background -->
            <div class="absolute w-[320px] h-[320px] rounded-full glow-orb opacity-60"></div>
            <!-- Core Orb -->
            <div class="relative w-48 h-48 rounded-full bg-gradient-to-tr from-primary to-[#f3d08c] shadow-[0_0_60px_rgba(212,169,84,0.5)] border border-primary/20">
                <div class="absolute inset-0 rounded-full bg-white/10 backdrop-blur-[2px]"></div>
            </div>
        </div>

        <!-- Headline and Text -->
        <div class="mt-12 text-center z-10 px-6">
            <h1 class="text-white font-serif text-[40px] leading-tight mb-2 tracking-tight">Take a Pause</h1>
            <p class="text-primary/80 text-lg font-light tracking-wide">60 seconds</p>
        </div>
    </div>

    <!-- Selection & Controls -->
    <div class="px-6 pb-12 flex flex-col gap-8">
        <!-- Segmented Pill Buttons -->
        <div class="flex justify-center">
            <div class="flex h-12 w-full max-w-sm items-center justify-center rounded-full bg-white/5 backdrop-blur-xl p-1 border border-white/10">
                <label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-4 has-[:checked]:bg-primary/20 has-[:checked]:text-primary text-white/50 text-sm font-medium transition-all">
                    <span class="truncate">Breathing</span>
                    <input checked="" class="hidden" name="exercise-type" type="radio" value="Breathing"/>
                </label>
                <label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-4 has-[:checked]:bg-primary/20 has-[:checked]:text-primary text-white/50 text-sm font-medium transition-all">
                    <span class="truncate">Light</span>
                    <input class="hidden" name="exercise-type" type="radio" value="Light"/>
                </label>
                <label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-4 has-[:checked]:bg-primary/20 has-[:checked]:text-primary text-white/50 text-sm font-medium transition-all">
                    <span class="truncate">Count</span>
                    <input class="hidden" name="exercise-type" type="radio" value="Count"/>
                </label>
            </div>
        </div>

        <!-- Large Start Button -->
        <div class="flex justify-center">
            <button class="group relative flex h-16 w-full max-w-xs items-center justify-center overflow-hidden rounded-full bg-primary px-8 text-lg font-bold text-[#0A0E1A] shadow-[0_10px_40px_rgba(212,169,84,0.3)] hover:scale-[1.02] active:scale-95 transition-all">
                <span>Start Session</span>
                <div class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
            </button>
        </div>
    </div>

    <!-- Simple Visual Elements (Stars/Dust) -->
    <div class="absolute top-1/4 left-10 w-1 h-1 bg-white/20 rounded-full"></div>
    <div class="absolute top-1/3 right-12 w-1.5 h-1.5 bg-primary/30 rounded-full"></div>
    <div class="absolute bottom-1/4 left-20 w-1 h-1 bg-white/10 rounded-full"></div>
    <div class="absolute bottom-1/3 right-1/4 w-1 h-1 bg-primary/20 rounded-full"></div>
</div>

</body></html>
